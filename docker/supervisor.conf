[supervisord]
nodaemon=true
logfile=/app/data/supervisord.log
pidfile=/var/run/supervisord.pid

; Local-only RPC socket so the 9router UI can `supervisorctl` caddy
; on/off when the user binds an SSL domain.
[unix_http_server]
file=/app/data/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///app/data/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:9router]
command=node /app/custom-server.js
user=node
autostart=true
autorestart=true
stdout_logfile=/app/data/9router.log
stderr_logfile=/app/data/9router.err

[program:mihomo]
command=/usr/local/bin/mihomo -d /app/data/mihomo
user=node
autostart=true
autorestart=true
stdout_logfile=/app/data/mihomo.log
stderr_logfile=/app/data/mihomo.err

; Tailscale daemon in userspace-networking mode — no NET_ADMIN/TUN required.
; State + socket persist under /app/data/tailscale so the tailnet identity
; survives container restarts. The 9router UI talks to this via the
; --socket path it discovers from /app/data/bin or known locations.
[program:tailscaled]
command=/usr/local/bin/tailscaled --tun=userspace-networking --socket=/app/data/tailscale/tailscaled.sock --statedir=/app/data/tailscale --state=/app/data/tailscale/tailscaled.state
user=node
autostart=true
autorestart=true
stdout_logfile=/app/data/tailscaled.log
stderr_logfile=/app/data/tailscaled.err

; Caddy reverse-proxy + ACME for HTTPS. Started on demand by the
; /api/ssl/start endpoint after the user binds a domain — autostart
; is OFF so the container does not try to bind 443 / fetch a cert
; before any domain is configured. The 9router UI uses
; `supervisorctl start caddy` (or restart) to bring it up.
[program:caddy]
command=/usr/local/bin/caddy run --config /app/data/caddy/Caddyfile --adapter caddyfile
user=node
autostart=false
autorestart=true
stdout_logfile=/app/data/caddy.log
stderr_logfile=/app/data/caddy.err
environment=XDG_DATA_HOME=/app/data/caddy/data,XDG_CONFIG_HOME=/app/data/caddy/config

